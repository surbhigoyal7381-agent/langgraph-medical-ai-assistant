name: CI

on:
  pull_request:
    branches: [ master ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Security static analysis
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install trufflehog (example SAST-like scanner)
        run: |
          python -m pip install --upgrade pip
          python -m pip install trufflehog
      - name: Run secret scan
        run: trufflehog filesystem --exclude-paths frontend/node_modules --json . > trufflehog-results.json || true
      - name: Upload trufflehog results
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Syntax check (compile)
        run: python -m compileall backend

  streaming-tests:
    runs-on: ubuntu-latest
    services:
      backend:
        image: python:3.11
        options: >-
          --health-cmd "python -c 'import sys, time; time.sleep(1); sys.exit(0)'" 
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Start backend in background
        run: |
          (cd backend && python -m uvicorn app:app --port 8000) &
          sleep 2
      - name: Run streaming contract test
        run: |
          python - <<'PY'
import requests, time
url='http://127.0.0.1:8000/chat'
payload={'message':'test streaming','patient_id':'1','thread_id':'1'}
with requests.post(url,json=payload,stream=True,timeout=10) as r:
    assert r.status_code==200
    data=''
    for line in r.iter_lines():
        if line:
            s=line.decode()
            if s.startswith('data:'):
                piece=s.replace('data:','').strip()
                try:
                    import json
                    obj=json.loads(piece)
                    if obj.get('type') in ('chunk','end'):
                        print('received',obj.get('type'))
                except Exception:
                    pass
print('streaming test passed')
PY
